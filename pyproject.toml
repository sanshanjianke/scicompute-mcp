[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scicompute-mcp"
version = "0.1.3"
description = "MCP server for scientific computing with multiple backends"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["mcp", "scientific-computing", "mathematica", "sagemath", "octave", "r", "matlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "sympy>=1.12.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
mathematica = ["wolframclient>=1.4.0"]
octave = ["oct2py>=5.8.0"]
julia = ["juliacall>=0.9.0"]
all = [
    "wolframclient>=1.4.0",
    "oct2py>=5.8.0",
    "juliacall>=0.9.0",
]
test = ["pytest>=7.0.0"]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/sanshanjianke/scicompute-mcp"
Repository = "https://github.com/sanshanjianke/scicompute-mcp"
Issues = "https://github.com/sanshanjianke/scicompute-mcp/issues"

[project.scripts]
scicompute-mcp = "scicompute_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/scicompute_mcp"]